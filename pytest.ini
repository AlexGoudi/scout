; Test discovery, so that `pytest` with no arguments finds the suite.
;
; The unit files are named `unit_test_*.py` rather than `test_*.py`, which default
; discovery does not match. Both naming conventions are matched here: `unit_test_*.py`
; for the units and `test_*.py` for the conformance suite under tests/conformance/.
;
; `integration_test_*.py` is deliberately absent from `python_files`. Those tests fetch
; from a real remote and the suite is offline by requirement, not by convenience (NFR-10),
; so they stay opt-in: name the file on the command line and set $SCOUT_NETWORK_TESTS=1,
; or they do not run.
[pytest]
testpaths = tests
python_files = test_*.py unit_test_*.py
addopts = --strict-markers
